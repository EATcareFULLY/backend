version: "3.8"

services:

  database_server:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eatcarefully
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eat_network

  keycloak:
    container_name: keycloak
    image: bitnami/keycloak:24.0.5
    volumes:
      - ./import/realm:/opt/bitnami/keycloak/data/import
      - ./import/theme:/opt/bitnami/keycloak/providers
    environment:
      KEYCLOAK_DATABASE_HOST: keycloak_db
      KEYCLOAK_DATABASE_NAME: keycloakdb
      KEYCLOAK_DATABASE_USER: postgres
      KEYCLOAK_DATABASE_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_EXTRA_ARGS: "--import-realm"
    ports:
      - "8080:8080"
    networks:
      - eat_network

  keycloak_db:
    image: postgres
    container_name: keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: keycloakdb
    ports:
      - "54321:5432"
    healthcheck:
      test: "exit 0"
    networks:
      - eat_network

#  server:
#    build: .
#    ports:
#      - "8081:8081"
#    networks:
#      - eat_network
#    depends_on: [database_server]

networks:
  eat_network:
volumes:
  postgres_data:


