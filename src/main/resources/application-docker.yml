spring:
  application:
    name: backend

  # postgres as database
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/eat-carefully}
          jwk-set-uri: ${RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/eat-carefully/protocol/openid-connect/certs}

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: ${FLYWAY_DISABLE_CLEAN:true}
    clean-on-validation-error: ${FLYWAY_ENABLE_CLEAN_ON_ERROR:false}

security:
  enabled: ${SECURITY_ENABLED:true}

jwt:
  auth:
    converter:
      resource-id: backend_client_docker
      principle-attribute: preferred_username

app:
  init-mock-leaderboard: ${INIT_MOCK_LEADERBOARD:false}

server:
  port: 8081
  servlet:
    context-path: /api

tesseract:
  path: ${TESSERACT_DATA_PATH:app/tessdata}

logging:
  level:
    org:
      springframework:
        security: DEBUG
