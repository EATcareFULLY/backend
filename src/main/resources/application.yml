spring:
  application:
    name: backend

  # postgres as database
  datasource:
    url: jdbc:postgresql://localhost:6543/eatcarefully
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/eat-carefully
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: ${FLYWAY_DISABLE_CLEAN:false}
    clean-on-validation-error: ${FLYWAY_ENABLE_CLEAN_ON_ERROR:true}

security:
  enabled: ${SECURITY_ENABLED:true}

jwt:
  auth:
    converter:
      resource-id: backend_client
      principle-attribute: preferred_username

app:
  init-mock-leaderboard: ${INIT_MOCK_LEADERBOARD:false}

server:
  port: 8081
  servlet:
    context-path: /api

tesseract:
  path: ${TESSERACT_DATA_PATH:classpath:tessdata}

