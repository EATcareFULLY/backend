spring:
  application:
    name: backend

  # postgres as database
  datasource:
    url: jdbc:postgresql://localhost:6543/eatcarefully
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # h2 as database
#  datasource:
#    url: jdbc:h2:mem:testdb
#    driverClassName: org.h2.Driver
#    username: sa
#    password: password
#  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect


  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: backend_client
            client-secret: HtGU6TxlSfOz2rKBnhEi9XRk2rLJtKJw
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8081/login/oauth2/code/keycloak
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/eat-carefully/protocol/openid-connect/auth
            token-uri: http://localhost:8080/realms/eat-carefully/protocol/openid-connect/token
            user-info-uri: http://localhost:8080/realms/eat-carefully/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:8080/realms/eat-carefully/protocol/openid-connect/certs
            user-name-attribute: preferred_username


server:
  port: 8081
